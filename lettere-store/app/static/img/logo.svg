<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 95" width="420" height="95">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="block-top" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f9a8d4"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
  </defs>

  <!-- Blocco 3D – faccia laterale destra (ombra) -->
  <polygon points="55,15 63,8 63,66 55,73" fill="#c4b5fd" opacity="0.8"/>
  <!-- Blocco 3D – faccia superiore -->
  <polygon points="3,15 11,8 63,8 55,15" fill="#f9a8d4" opacity="0.9"/>
  <!-- Blocco 3D – faccia frontale -->
  <rect x="3" y="15" width="52" height="58" rx="4" fill="url(#grad)"/>
  <!-- Riflesso luce in alto -->
  <ellipse cx="29" cy="21" rx="16" ry="5" fill="white" opacity="0.18"/>
  <!-- Lettera P sul blocco -->
  <text x="11" y="60" font-family="Georgia, 'Times New Roman', serif"
        font-size="36" font-weight="bold" fill="white">P</text>

  <!-- Stellina decorativa -->
  <g transform="translate(57,9)">
    <polygon points="0,-6 1.4,-2 5.7,-2 2.3,1.4 3.5,5.8 0,3.2 -3.5,5.8 -2.3,1.4 -5.7,-2 -1.4,-2"
             fill="#fde68a"/>
  </g>

  <!-- Nome brand -->
  <text x="76" y="62"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="46" font-weight="bold">
    <tspan fill="url(#grad)">PICCOL</tspan><tspan fill="#1f2937">ETTERE</tspan>
  </text>

  <!-- Pallini decorativi tra le due parole -->
  <circle cx="71" cy="56" r="2.5" fill="#f9a8d4" opacity="0.8"/>
  <circle cx="71" cy="64" r="2" fill="#c4b5fd" opacity="0.7"/>

  <!-- Tagline -->
  <text x="76" y="82"
        font-family="Arial, Helvetica, sans-serif"
        font-size="10.5" fill="#9ca3af" letter-spacing="2.2">
    LETTERE · NUMERI · DECORAZIONI 3D
  </text>
</svg>
